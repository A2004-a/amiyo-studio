name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,   os: windows-latest, script: 'dist:win64', file: 'dist/Amiyo-Studio-win-x64.exe' }
          - { name: win-ia32,  os: windows-latest, script: 'dist:win32', file: 'dist/Amiyo-Studio-win-ia32.exe' }
          - { name: linux,     os: ubuntu-latest,  script: 'dist:linux', file: 'dist/Amiyo-Studio-linux-x86_64.AppImage' }
          - { name: mac,       os: macos-latest,   script: 'dist:mac',   file: 'dist/Amiyo-Studio-mac.dmg' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --fetch-retries 5

      - name: Build Desktop Distribution
        run: |
          npm run ${{ matrix.script }} -- --publish never || \
          (sleep 5 && npm run ${{ matrix.script }} -- --publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ matrix.file }}
          tag_name: ${{ github.ref_name }}
          name: Amiyo Studio ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          mkdir -p ~/.android && touch ~/.android/repositories.cfg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Web Application Assets
        run: node scripts/sync-android.js

      - name: Build Android APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" ../dist/Amiyo-Studio-android.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/Amiyo-Studio-android.apk
          tag_name: ${{ github.ref_name }}
          name: Amiyo Studio ${{ github.ref_name }}
          make_latest: true
